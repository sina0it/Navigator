version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sina_navigator_db
    restart: always
    environment:
      POSTGRES_USER: sina
      POSTGRES_PASSWORD: sinapassword123
      POSTGRES_DB: sina_navigator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: sina_navigator_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://sina:sinapassword123@postgres:5432/sina_navigator?schema=public
      JWT_SECRET: sina_navigator_super_secret_jwt_key_2026
    depends_on:
      - postgres

volumes:
  pgdata:
